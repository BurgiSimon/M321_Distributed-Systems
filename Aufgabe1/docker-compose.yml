services:
  backend1:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - BACKENDS=backend2:3000,backend3:3000
    restart: unless-stopped

  backend2:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "3002:3000"
    environment:
      - PORT=3000
      - BACKENDS=backend1:3000,backend3:3000
    restart: unless-stopped

  backend3:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "3003:3000"
    environment:
      - PORT=3000
      - BACKENDS=backend1:3000,backend2:3000
    restart: unless-stopped
