services:
  loadbalancer:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "8080:80"
    depends_on:
      - backend1
      - backend2
      - backend3
    restart: unless-stopped

  backend1:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      - PORT=3000
      - BACKENDS=backend2:3000,backend3:3000
    restart: unless-stopped

  backend2:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      - PORT=3000
      - BACKENDS=backend1:3000,backend3:3000
    restart: unless-stopped

  backend3:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      - PORT=3000
      - BACKENDS=backend1:3000,backend2:3000
    restart: unless-stopped
